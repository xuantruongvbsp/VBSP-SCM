name: CI — VBSP-SCM

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint + Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system deps (tesseract + poppler)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-vie poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      - name: Syntax check (py_compile)
        run: |
          python -m compileall -q . \
            --exclude ".venv|venv|__pycache__|.git"

      - name: Convention check
        run: |
          python scripts/check_conventions.py --all || true

      - name: Run test suite
        run: |
          pytest tests/ -q --tb=short \
            --cov=. --cov-report=term-missing \
            --ignore=.venv --ignore=venv

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  docker-build:
    name: Docker build check
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: |
          docker build -t vbsp-scm:${{ github.sha }} .
          docker build -t vbsp-scm:latest .

      - name: Smoke test container
        run: |
          docker run --rm -d --name vbsp_test \
            -p 8501:8501 \
            vbsp-scm:latest
          sleep 10
          curl -f http://localhost:8501/_stcore/health || \
            (docker logs vbsp_test && exit 1)
          docker stop vbsp_test
