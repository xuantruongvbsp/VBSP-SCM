[theme]
base = "dark"
primaryColor = "#42A5F5"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1E2130"
textColor = "#FFFFFF"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
port = 8502
headless = true
fileWatcherType = "watchdog"
runOnSave = true
# Giới hạn upload file (MB) — mặc định Streamlit chỉ 200MB, không đủ cho zip backup toàn CN.
maxUploadSize = 2048
maxMessageSize = 2048
folderWatchBlacklist = ["cache", "pgd_data", "data/baseline", "data/baseline_pgd", "__pycache__", ".git", "logs"]

[client]
showErrorDetails = true
